<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="雷达报告">
  <title>地基雷达监测报告生成器</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="app">
  <header class="hero">
    <span class="pill">Mobile V1 · 本机处理</span>
    <h1>地基雷达监测报告生成器</h1>
    <p>在 iPhone / iPad / 电脑浏览器中读取雷达平台导出的 Excel，生成 6 小时、24 小时监测报告与 24 小时对比表。</p>
  </header>

  <section class="card">
    <h2>1. 选择数据文件</h2>
    <div class="file-grid">
      <div class="file-box">
        <label for="faceFile">面数据（M1–M15）</label>
        <input class="file-input" id="faceFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
        <div class="file-meta" id="faceMeta">未选择文件</div>
      </div>
      <div class="file-box">
        <label for="pointFile">点数据（S1–S15）</label>
        <input class="file-input" id="pointFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
        <div class="file-meta" id="pointMeta">未选择文件</div>
      </div>
    </div>
    <div class="btn-row"><button class="btn primary" id="loadBtn">加载数据</button></div>
    <div class="status" id="status">请选择手机“文件”中的两份 .xlsx 数据。所有计算都在当前浏览器内完成。</div>
  </section>

  <div class="tabs">
    <button class="tab-btn active" data-tab="p6">6 小时报告</button>
    <button class="tab-btn" data-tab="p24">24 小时报告</button>
  </div>

  <section class="panel active" id="p6">
    <div class="card">
      <h2>2. 6 小时报告</h2>
      <div class="time-grid">
        <div class="field"><label for="s6">开始时间</label><select id="s6"></select></div>
        <div class="field"><label for="e6">结束时间</label><select id="e6"></select></div>
      </div>
      <div class="btn-row"><button class="btn secondary" id="auto6">自动推荐</button><button class="btn primary" id="gen6">生成报告</button></div>
      <div style="height:12px"></div>
      <textarea class="report" id="report6" readonly placeholder="生成后的 6 小时报告显示在这里"></textarea>
      <div class="btn-row">
        <button class="btn green" id="copy6" disabled>复制报告</button>
        <button class="btn" id="share6" disabled>分享</button>
        <button class="btn" id="txt6" disabled>保存 TXT</button>
      </div>
    </div>
  </section>

  <section class="panel" id="p24">
    <div class="card">
      <h2>2. 24 小时报告</h2>
      <div class="period">
        <h3>当前周期</h3>
        <div class="time-grid">
          <div class="field"><label for="s24">开始时间</label><select id="s24"></select></div>
          <div class="field"><label for="e24">结束时间</label><select id="e24"></select></div>
        </div>
      </div>
      <div class="period">
        <h3>对比周期</h3>
        <div class="time-grid">
          <div class="field"><label for="ps24">开始时间</label><select id="ps24"></select></div>
          <div class="field"><label for="pe24">结束时间</label><select id="pe24"></select></div>
        </div>
      </div>
      <div class="btn-row"><button class="btn secondary" id="auto24">自动推荐</button><button class="btn primary" id="gen24">生成报告</button></div>
      <div style="height:12px"></div>
      <textarea class="report" id="report24" readonly placeholder="生成后的 24 小时报告显示在这里"></textarea>
      <div class="btn-row">
        <button class="btn green" id="copy24" disabled>复制报告</button>
        <button class="btn" id="share24" disabled>分享</button>
        <button class="btn" id="txt24" disabled>保存 TXT</button>
        <button class="btn secondary" id="xlsx24" disabled>导出 Excel 对比表</button>
      </div>
      <div class="helper">“相对于上一周期变化量”沿用桌面版定义：当前周期位移量 − 对比周期位移量。</div>
    </div>
  </section>

  <div class="footer">建议首次打开时保持网络连接，使 Excel 组件完成加载。添加到 iPhone 主屏幕后可按 Web App 方式使用。</div>
</div>
<div class="toast" id="toast"></div>
<script src="./app.js"></script>
</body>
</html>
